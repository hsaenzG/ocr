version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
        - npm run build -w @ocr/shared
    build:
      commands:
        - echo "PUBLIC_API_BASE_URL=$PUBLIC_API_BASE_URL"
        - npm run build -w @ocr/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
